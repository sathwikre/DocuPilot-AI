[theme]
base = "light"
primaryColor = "#D9480F"
backgroundColor = "#F3ECE0"
secondaryBackgroundColor = "#F4ECDF"
textColor = "#2A1F17"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#2B1D14"
secondaryBackgroundColor = "#3A2819"
textColor = "#F3E9D7"
primaryColor = "#F97316"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 60
runOnSave = false
headless = true

[browser]
# Privacy: do not send usage statistics anywhere.
gatherUsageStats = false
